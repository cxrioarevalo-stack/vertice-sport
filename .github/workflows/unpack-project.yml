name: Unpack VERTICE project

on:
  push:
    paths:
      - 'VERTICE_SPORT_RENDER_UPLOAD.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack project
        run: |
          unzip -o VERTICE_SPORT_RENDER_UPLOAD.zip -d .deploy_unpack
          cp -a .deploy_unpack/. .
          rm -rf .deploy_unpack VERTICE_SPORT_RENDER_UPLOAD.zip
          rm -rf .github/workflows/unpack-project.yml

      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Deploy VERTICE SPORT project"
          git push
